[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "igc"
version = "0.1.0"
description = "The Standard Model's induced Newton constant, counted exactly"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David T. Swanson" }]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mpmath>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/igc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
